services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

  # One-shot: pulls the chat model the first time the stack starts.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 3 && OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"

  api:
    build: .
    depends_on: [qdrant, ollama]
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
      - hf_cache:/root/.cache/huggingface
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  ui:
    build: .
    depends_on: [api]
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]

volumes:
  qdrant_data:
  ollama_data:
  app_data:
  hf_cache:
